[package]
name = "mithril-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Load speed and peak memory of Mithril's readers against the leading crate for each format"

# Its own workspace, so the competitors never enter Mithril's dependency graph or lockfile.
[workspace]

[features]
# Bench another commit's Mithril alongside this one. The workflow checks it out and adds the
# `mithril_base` dependency; see bench.yml.
baseline = []

[dependencies]
mithril = { path = "..", default-features = false, features = ["minimal"] }
serde_json = "1"
tobj = "4.0.5"
stl_io = "0.11"
ply-rs = "0.1.3"
gltf = "1.4"

[profile.release]
lto = "fat"
codegen-units = 1
debug = false
